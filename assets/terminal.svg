<svg
  width="900"
  height="430"
  viewBox="0 0 900 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg {
      fill: #0d1117;
    }

    .terminal {
      fill: #0d1117;
      stroke: url(#borderGradient);
      stroke-width: 2;
    }

    .titlebar {
      fill: #161b22;
    }

    .text {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      fill: #c9d1d9;
    }

    .prompt {
      fill: #7ee787;
      font-weight: bold;
    }

    .command {
      fill: #58a6ff;
    }

    .highlight {
      fill: #d2a8ff;
      font-weight: bold;
    }

    .location {
      fill: #ff7b72;
    }

    .glow {
      filter: drop-shadow(0 0 6px #58a6ff);
    }

    /* ==================================
       MAIN LOOP
       ================================== */

    .line {
      opacity: 0;
      animation-duration: 9s;
      animation-iteration-count: infinite;
      animation-timing-function: ease;
    }

    .l1 { animation-name: line1; }
    .l2 { animation-name: line2; }
    .l3 { animation-name: line3; }
    .l4 { animation-name: line4; }
    .l5 { animation-name: line5; }
    .l6 { animation-name: line6; }
    .l7 { animation-name: line7; }

    /* who-am-i */

    @keyframes line1 {
      0%, 7% {
        opacity: 0;
        transform: translateY(8px);
      }

      8%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* Makhmud */

    @keyframes line2 {
      0%, 16% {
        opacity: 0;
        transform: translateY(8px);
      }

      17%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* location command */

    @keyframes line3 {
      0%, 27% {
        opacity: 0;
        transform: translateY(8px);
      }

      28%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* London */

    @keyframes line4 {
      0%, 37% {
        opacity: 0;
        transform: translateY(8px);
      }

      38%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* build future command */

    @keyframes line5 {
      0%, 49% {
        opacity: 0;
        transform: translateY(8px);
      }

      50%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* building text */

    @keyframes line6 {
      0%, 59% {
        opacity: 0;
        transform: translateY(8px);
      }

      60%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* progress + ready */

    @keyframes line7 {
      0%, 69% {
        opacity: 0;
        transform: translateY(8px);
      }

      70%, 94% {
        opacity: 1;
        transform: translateY(0);
      }

      98%, 100% {
        opacity: 0;
      }
    }

    /* ==================================
       CURSOR
       ================================== */

    .cursor-group {
      opacity: 0;
      animation: cursorShow 9s infinite;
    }

    .cursor {
      fill: #58a6ff;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes cursorShow {
      0%, 69% {
        opacity: 0;
      }

      70%, 94% {
        opacity: 1;
      }

      98%, 100% {
        opacity: 0;
      }
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }

    /* ==================================
       PROGRESS BAR
       ================================== */

    .progress {
      transform-origin: left center;
      transform-box: fill-box;
      animation: progressGrow 9s infinite ease;
    }

    @keyframes progressGrow {
      0%, 69% {
        transform: scaleX(0);
        opacity: 0;
      }

      70% {
        transform: scaleX(0);
        opacity: 1;
      }

      88%, 94% {
        transform: scaleX(1);
        opacity: 1;
      }

      98%, 100% {
        transform: scaleX(0);
        opacity: 0;
      }
    }

    /* ==================================
       SCANNER
       ================================== */

    .scan {
      fill: url(#scanGradient);
      opacity: 0.10;
      animation: scanMove 4s linear infinite;
    }

    @keyframes scanMove {
      from {
        transform: translateY(-430px);
      }

      to {
        transform: translateY(430px);
      }
    }
  </style>

  <defs>

    <linearGradient
      id="borderGradient"
      x1="0"
      y1="0"
      x2="900"
      y2="430">

      <stop
        offset="0"
        stop-color="#58A6FF"
      />

      <stop
        offset="0.5"
        stop-color="#A371F7"
      />

      <stop
        offset="1"
        stop-color="#39C5CF"
      />

    </linearGradient>

    <linearGradient
      id="progressGradient"
      x1="0"
      y1="0"
      x2="650"
      y2="0">

      <stop
        offset="0"
        stop-color="#58A6FF"
      />

      <stop
        offset="0.5"
        stop-color="#A371F7"
      />

      <stop
        offset="1"
        stop-color="#39C5CF"
      />

    </linearGradient>

    <linearGradient
      id="scanGradient"
      x1="0"
      y1="0"
      x2="0"
      y2="100">

      <stop
        offset="0"
        stop-color="#58A6FF"
        stop-opacity="0"
      />

      <stop
        offset="0.5"
        stop-color="#58A6FF"
        stop-opacity="1"
      />

      <stop
        offset="1"
        stop-color="#58A6FF"
        stop-opacity="0"
      />

    </linearGradient>

    <clipPath id="terminalClip">
      <rect
        x="2"
        y="2"
        width="896"
        height="426"
        rx="17"
      />
    </clipPath>

  </defs>

  <!-- Background -->

  <rect
    width="900"
    height="430"
    rx="18"
    class="bg"
  />

  <!-- Terminal -->

  <rect
    x="1"
    y="1"
    width="898"
    height="428"
    rx="18"
    class="terminal"
  />

  <!-- Top Bar -->

  <path
    d="M1 18C1 8.6 8.6 1 18 1H882C891.4 1 899 8.6 899 18V55H1V18Z"
    class="titlebar"
  />

  <!-- Traffic Lights -->

  <circle
    cx="28"
    cy="28"
    r="7"
    fill="#ff5f56"
  />

  <circle
    cx="52"
    cy="28"
    r="7"
    fill="#ffbd2e"
  />

  <circle
    cx="76"
    cy="28"
    r="7"
    fill="#27c93f"
  />

  <!-- Terminal Title -->

  <text
    x="450"
    y="34"
    text-anchor="middle"
    class="text"
    font-size="15">

    makhmud@github: ~/DEF4ULT-M

  </text>

  <!-- =========================
       WHO AM I
       ========================= -->

  <text
    x="30"
    y="100"
    class="text line l1">

    <tspan class="prompt">
      ➜  ~
    </tspan>

    <tspan class="command">
      who-am-i
    </tspan>

  </text>

  <text
    x="30"
    y="135"
    class="text line l2">

    <tspan class="highlight">
      Makhmud
    </tspan>

    <tspan>
      — Data Scientist • Backend Developer • Web Developer
    </tspan>

  </text>

  <!-- =========================
       LOCATION
       ========================= -->

  <text
    x="30"
    y="190"
    class="text line l3">

    <tspan class="prompt">
      ➜  ~
    </tspan>

    <tspan class="command">
      location
    </tspan>

  </text>

  <text
    x="30"
    y="225"
    class="text line l4">

    <tspan class="location">
      London, United Kingdom 🇬🇧
    </tspan>

  </text>

  <!-- =========================
       BUILD FUTURE
       ========================= -->

  <text
    x="30"
    y="280"
    class="text line l5">

    <tspan class="prompt">
      ➜  ~
    </tspan>

    <tspan class="command">
      ./build-future
    </tspan>

  </text>

  <text
    x="30"
    y="315"
    class="text line l6">

    <tspan>
      Building ideas into scalable software...
    </tspan>

  </text>

  <!-- =========================
       PROGRESS BAR
       ========================= -->

  <rect
    x="30"
    y="340"
    width="650"
    height="11"
    rx="5"
    fill="#21262d"
    class="line l7"
  />

  <rect
    x="30"
    y="340"
    width="520"
    height="11"
    rx="5"
    fill="url(#progressGradient)"
    class="progress glow"
  />

  <text
    x="700"
    y="351"
    class="text line l7"
    font-size="15">

    80%

  </text>

  <!-- =========================
       READY
       ========================= -->

  <text
    x="30"
    y="395"
    class="text line l7">

    <tspan class="prompt">
      ➜  ~
    </tspan>

    <tspan>
      ready
    </tspan>

  </text>

  <!-- Blinking Cursor -->

  <g class="cursor-group">

    <rect
      x="115"
      y="380"
      width="10"
      height="20"
      rx="1"
      class="cursor"
    />

  </g>

  <!-- Moving Scanner -->

  <g clip-path="url(#terminalClip)">

    <rect
      x="4"
      y="0"
      width="892"
      height="80"
      class="scan"
    />

  </g>

</svg>
